[tool.poetry]
name = "orbit-backend"
version = "0.1.0"
description = "Orbit — FastAPI backend for the Orbit frontend (event discovery, tickets, organisers, circles, communities)"
authors = ["Orbit <dev@orbit.example>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
greenlet = "^3.1.0"
alembic = "^1.14.0"
psycopg2-binary = "^2.9.10"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
python-dotenv = "^1.0.1"
pyjwt = {extras = ["crypto"], version = "^2.10.0"}
python-multipart = "^0.0.20"
bcrypt = "^4.2.0"
httpx = "^0.28.1"
email-validator = "^2.2.0"
icalendar = "^6.1.0"
python-dateutil = "^2.9.0"
stripe = "^11.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.8.0"
black = "^24.10.0"
isort = "^5.13.0"
mypy = "^1.13.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.isort]
profile = "black"

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
